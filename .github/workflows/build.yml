name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 toolchains
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc

      - name: Build all four DLLs
        shell: cmd
        run: build.bat

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: universal-vsync-proxy
          path: |
            build/x64/dxgi.dll
            build/x64/d3d9.dll
            build/x86/dxgi.dll
            build/x86/d3d9.dll
          if-no-files-found: error
